---
dns_backend: manual  # noqa: var-naming[no-role-prefix]
dns_record: ""  # noqa: var-naming[no-role-prefix]
dns_ip: ""  # noqa: var-naming[no-role-prefix]
dns_poll_retries: 60  # noqa: var-naming[no-role-prefix]
dns_poll_delay: 10  # noqa: var-naming[no-role-prefix]
dns_resolvers: ["1.1.1.1", "8.8.8.8"]  # noqa: var-naming[no-role-prefix]
dns_hostsfile_path: /etc/hosts  # noqa: var-naming[no-role-prefix]
