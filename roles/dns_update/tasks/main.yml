---
- name: Check dns_update inputs
  ansible.builtin.assert:
    that:
      - dns_record | length > 0
      - dns_ip | length > 0
    fail_msg: "dns_update needs dns_record (fqdn) and dns_ip"

- name: Probe dig on the controller
  ansible.builtin.command:
    argv: [dig, -v]
  register: dns_update_dig_probe
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Check dig is available on the controller
  ansible.builtin.assert:
    that: dns_update_dig_probe.rc | default(1) == 0
    fail_msg: "dig is not installed on the controller (needed to verify DNS); install bind-utils/dnsutils"
  run_once: true

- name: Update DNS record via backend
  ansible.builtin.include_tasks: "backend_{{ dns_backend }}.yml"
  run_once: true

- name: Wait until public resolvers return the new IP
  ansible.builtin.command:
    argv: [dig, +short, "{{ dns_record }}", "@{{ item }}"]
  loop: "{{ dns_resolvers }}"
  register: dns_update_dig
  until: dns_ip in dns_update_dig.stdout_lines
  retries: "{{ dns_poll_retries }}"
  delay: "{{ dns_poll_delay }}"
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true
