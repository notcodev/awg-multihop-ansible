# Installed by Ansible (entry_uplink). Policy routing and the fail-closed
# firewall must be up before Docker starts any container. ExecStartPre makes
# that a hard requirement: if `multihop-entry-net up` fails, Docker (and with
# it amnezia-awg2) does not start, instead of forwarding via the main table.
[Unit]
Wants=multihop-net.service
After=multihop-net.service

[Service]
ExecStartPre=/usr/local/sbin/multihop-entry-net up
