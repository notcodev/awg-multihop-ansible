---
# Move the exit to a new host (same vault identity, so the entry needs no change).
# Inventory: the new host in `exit`, optionally the old one in `exit_old`.
#   ansible-playbook playbooks/swap-exit.yml [-e stop_old=yes]
- name: Check the swap inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Exactly one new exit host
      ansible.builtin.assert:
        that: groups['exit'] | default([]) | length == 1
        fail_msg: "Put exactly one host (the new exit) in the exit group"

- name: Deploy the new exit
  ansible.builtin.import_playbook: exit.yml

- name: Point the exit DNS record at the new exit
  hosts: exit
  gather_facts: false
  vars:
    dns_record: "{{ exit_domain }}"
    dns_ip: "{{ ansible_host | default(inventory_hostname) }}"
  tasks:
    - name: Update DNS
      ansible.builtin.include_role:
        name: dns_update

# multihop-reresolve on the entry follows the DNS change within about a minute
# (plus the record's TTL on the entry's resolver). The old exit has the same
# identity and may still be up, so a fresh handshake alone proves nothing:
# also require the new endpoint on the entry and a session on the new exit.
- name: Wait for the entry to handshake with the new exit
  hosts: entry
  become: true
  gather_facts: false
  tasks:
    - name: Wait up to 5 minutes for the new endpoint and a fresh handshake
      ansible.builtin.include_tasks: tasks/wait-handshake.yml
      vars:
        wait_handshake_endpoint: "{{ hostvars[groups['exit'][0]]['ansible_host'] | default(groups['exit'][0]) }}"
        wait_handshake_retries: 30

- name: Confirm the new exit has a session with the entry
  hosts: exit
  become: true
  gather_facts: false
  tasks:
    - name: Wait for a fresh handshake on awg-exit
      ansible.builtin.include_tasks: tasks/wait-handshake.yml
      vars:
        wait_handshake_container: multihop-exit
        wait_handshake_iface: awg-exit

- name: Verify
  ansible.builtin.import_playbook: verify.yml

- name: Stop the old exit
  hosts: exit_old
  become: true
  gather_facts: false
  tasks:
    - name: Stop multihop-exit and keep it stopped across reboots
      community.docker.docker_container:
        name: multihop-exit
        state: stopped
        restart_policy: "no"
      when: stop_old | default(false) | bool
