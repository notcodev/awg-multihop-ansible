---
# Wait until an AWG interface has a handshake younger than 180 s
# (latest-handshakes prints epoch seconds per peer; 0 means never).
# Inputs (defaults: the entry's uplink):
#   wait_handshake_container  multihop-uplink
#   wait_handshake_iface      awg-uplink
#   wait_handshake_endpoint   if set, also require this exact peer endpoint IP
#   wait_handshake_since      if set (epoch s), also require a handshake at or after it
#   wait_handshake_kick       if set, send a UDP packet to this tunnel address before
#                             each check (host netns). Unanswered data makes the
#                             initiator re-handshake within ~15 s; keepalives do not.
#   wait_handshake_retries    6 (10 s apart)
- name: Wait for a handshake younger than 180 s on {{ wait_handshake_iface | default('awg-uplink') }}
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      show() { docker exec "$CONTAINER" awg show "$IFACE" "$1"; }
      if [ -n "$ENDPOINT" ] && ! show endpoints \
          | awk -v ip="$ENDPOINT" '{ sub(/:[0-9]+$/, "", $2); if ($2 == ip) found = 1 } END { exit !found }'; then
        echo "peer endpoint is not $ENDPOINT yet" >&2
        exit 1
      fi
      if [ -n "$KICK" ]; then
        echo kick > "/dev/udp/$KICK/9" 2>/dev/null || true
      fi
      latest=$(show latest-handshakes | awk '{print $2}' | sort -n | tail -n 1)
      if [ -n "$SINCE" ] && [ "${latest:-0}" -lt "$SINCE" ]; then
        echo "no handshake since $SINCE yet" >&2
        exit 1
      fi
      echo $(( $(date +%s) - ${latest:-0} ))
    executable: /bin/bash
  environment:
    CONTAINER: "{{ wait_handshake_container | default('multihop-uplink') }}"
    IFACE: "{{ wait_handshake_iface | default('awg-uplink') }}"
    ENDPOINT: "{{ wait_handshake_endpoint | default('') }}"
    SINCE: "{{ wait_handshake_since | default('') }}"
    KICK: "{{ wait_handshake_kick | default('') }}"
  register: wait_handshake_age
  until: wait_handshake_age.rc == 0 and (wait_handshake_age.stdout | int) < 180
  retries: "{{ wait_handshake_retries | default(6) }}"
  delay: 10
  changed_when: false
